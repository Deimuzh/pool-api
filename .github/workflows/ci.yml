name: CI

on:
  push:
    branches: [main, develop, feat/modulo-seguridad]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Descargar dependencias
        run: go mod download

      - name: Lint con go vet
        run: go vet ./...

      - name: Ejecutar tests
    continue-on-error: true
    run: go test ./... -cover

      - name: Compilar API
        run: go build ./cmd/no-existe